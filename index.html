<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <body>
        <div class="container">

            <input type="button" value="save" class="btn btn-primary lg form-control mt-5 " onclick="saveTeacherName(this)"/>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        <script>
            
             //API call
             //let ceo1= new ClassName();
             let xhr = new XMLHttpRequest();
             // when a variable define outside the function it is called global variable;
             function saveTeacherName(e){ // e formal argument
                console.log(e)
                console.log(document.querySelector('.p_name').value);
                let tn = document.querySelector('.p_name').value;
                xhr.open('POST','http://localhost:1337/api/teachers');
                xhr.setRequestHeader('Content-Type','application/json');
                xhr.setRequestHeader('Accept','application/json');
                xhr.setRequestHeader('Authorization','Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MywiaWF0IjoxNzUwMjY2NDUyLCJleHAiOjE3NTI4NTg0NTJ9.EvjBiP82Gc3MLorzD8gS_vwIx7D2pJ31CxHrDJqmv5k');
                let payload = {
                                "data": {
                                    "fname": tn
                                }
                                };
                payload = JSON.stringify(payload);

                 
                xhr.send(payload);
             }

        </script>
    </body>
</html>
